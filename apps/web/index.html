<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kcode web</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { font-size: 15px; }
      body { background: var(--kcode-bg, #fafafa); color: var(--kcode-foreground, #1a1a2e); }
      /* 设计令牌（N1-5）：亮/暗色自动切换 */
      :root {
        --kcode-bg: #fafafa;
        --kcode-bg-panel: #ffffff;
        --kcode-bg-subtle: #f3f4f6;
        --kcode-border: #e5e7eb;
        --kcode-brand: #0891b2;
        --kcode-accent: #7c3aed;
        --kcode-foreground: #1a1a2e;
        --kcode-foreground-subtle: #6b7280;
        --kcode-success: #16a34a;
        --kcode-warning: #d97706;
        --kcode-destructive: #dc2626;
        --kcode-info: #2563eb;
        --kcode-diff-added: #16a34a;
        --kcode-diff-removed: #dc2626;
        --kcode-diff-context: #9ca3af;
        --kcode-interaction-ask: #d97706;
        --kcode-interaction-confirm: #16a34a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --kcode-bg: #111827;
          --kcode-bg-panel: #1f2937;
          --kcode-bg-subtle: #374151;
          --kcode-border: #374151;
          --kcode-brand: #22d3ee;
          --kcode-accent: #a78bfa;
          --kcode-foreground: #e5e7eb;
          --kcode-foreground-subtle: #9ca3af;
          --kcode-success: #4ade80;
          --kcode-warning: #fbbf24;
          --kcode-destructive: #f87171;
          --kcode-info: #60a5fa;
          --kcode-diff-added: #4ade80;
          --kcode-diff-removed: #f87171;
          --kcode-diff-context: #6b7280;
          --kcode-interaction-ask: #fbbf24;
          --kcode-interaction-confirm: #4ade80;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
